unit: lesson
side_effects:
  - source_loc: "src/pages/LessonPage.tsx:24"
    effect: "Reads and updates completed lesson IDs."
    must_preserve: true
  - source_loc: "src/pages/LessonPage.tsx:249"
    effect: "Persists completion toggle for the current lesson."
    must_preserve: true
branches:
  - source_loc: "src/pages/LessonPage.tsx:27-48"
    condition: "The route lesson ID is absent or cannot resolve a lesson/topic context."
    behavior: "Returns no lesson content."
    must_preserve: true
  - source_loc: "src/pages/LessonPage.tsx:116-138"
    condition: "Lesson has visualizer/problem references."
    behavior: "Shows external AlgoNerve and problem links."
    must_preserve: true
error_paths: []
concurrency:
  model: sync
  tx_boundary:
    source_loc: "src/store/userStore.ts:209"
    scope: "Lesson completion persists synchronously."
    isolation: "Browser storage serialization"
    must_preserve: true
