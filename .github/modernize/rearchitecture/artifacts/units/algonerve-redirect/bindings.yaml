unit: algonerve-redirect
bindings:
  - type: route-declaration
    name: "Route paths=/visualize, /visualize/:id, and /documentation"
    source_loc: "src/App.tsx:120-122"
    target: "AlgoNerveRedirect"
    must_appear_in_target: true
    notes: "The local embedded AlgoNerve pages are not mounted by these routes."
runtime_config:
  - key: "APP_CONFIG.algonerve.url"
    source_loc: "src/lib/config.ts:8-13"
    source: code
    default_value: "https://algonerve.vercel.app"
    must_appear_in_target: true
    notes: "External redirect base URL."
