unit: lpu-portal
side_effects:
  - source_loc: "src/pages/LpuPortalPage.tsx:33-35"
    effect: "Updates the active student's activity with the current LPU subject."
    must_preserve: true
  - source_loc: "src/pages/LpuPortalPage.tsx:250"
    effect: "Persists topic completion."
    must_preserve: true
branches:
  - source_loc: "src/pages/LpuPortalPage.tsx:24-32"
    condition: "Subject selection changes."
    behavior: "Loads the selected subject and its units/topics."
    must_preserve: true
  - source_loc: "src/pages/LpuPortalPage.tsx:380"
    condition: "A referenced problem ID is missing."
    behavior: "Does not render a problem modal entry."
    must_preserve: true
error_paths: []
concurrency:
  model: sync
  tx_boundary:
    source_loc: "src/store/userStore.ts:209"
    scope: "Completion, custom sets, and activity updates persist synchronously."
    isolation: "Browser storage serialization"
    must_preserve: true
