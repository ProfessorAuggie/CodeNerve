contracts:
  - name: algonerve-visualizer-redirect
    unit: algonerve-redirect
    type: sdk
    stability: frozen
    source_loc: "src/App.tsx:25-30"
    contract:
      method: "Browser navigation"
      path: "https://algonerve.vercel.app[/visualize/:id]"
      request: "Optional route parameter id"
      response: "External AlgoNerve page"
      error: "Local redirect fallback link remains available if navigation is blocked"
      auth: "None observed"
    target_contract:
      method: "window.location.href = https://algonerve.vercel.app[/visualize/:id]"
      notes: "Preserve the optional id path segment and the visible fallback anchor."
    semantic_divergence: []

  - name: external-problem-platform-links
    unit: problems
    type: sdk
    stability: must_preserve
    source_loc: "src/types/index.ts:91-114"
    contract:
      method: "Browser anchor navigation"
      path: "Problem.externalUrl"
      request: "User selects an external catalogue problem"
      response: "External problem page on the declared platform"
      error: "No local API response; link validation behavior is implemented by referenceValidator utilities/tests"
      auth: "Delegated to external platform"
    target_contract:
      method: "Anchor href uses the stored Problem.externalUrl"
      notes: "Do not reproduce external problem content; preserve platform attribution and outbound URL behavior."
    semantic_divergence: []

  - name: vercel-spa-history-fallback
    unit: global
    type: file
    stability: frozen
    source_loc: "vercel.json:1-7"
    contract:
      method: "HTTP GET"
      path: "Any client-side route"
      request: "Direct navigation or refresh at a React Router path"
      response: "/index.html"
      error: "Without rewrite, deep links return a hosting 404"
      auth: "None"
    target_contract:
      method: "Hosting rewrite all paths to /index.html"
      notes: "The client router must receive deep-link requests."
    semantic_divergence: []
