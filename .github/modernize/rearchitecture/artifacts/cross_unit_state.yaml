flows:
  - name: persisted-auth-and-learning-state
    medium: database
    key: "codenerve_user_storage_v2"
    writer:
      unit: authentication
      source_loc: "src/store/userStore.ts:561-675"
    reader:
      unit: dashboard
      source_loc: "src/pages/DashboardPage.tsx:20-39"
    pairing: matched
    must_preserve: true
    must_confirm: null
    verification_hint: "Register or log in, refresh the dashboard, and verify identity and progress remain available."
    notes: "The medium is browser localStorage through Zustand persist; database vocabulary is not intended."

  - name: problem-progress-to-roster
    medium: database
    key: "problemProgress → StudentRecord.solvedProblemIds"
    writer:
      unit: problems
      source_loc: "src/store/userStore.ts:276-329"
    reader:
      unit: administration
      source_loc: "src/pages/AdminPage.tsx:181-200"
    pairing: matched
    must_preserve: true
    must_confirm: null
    verification_hint: "Solve a problem as a student and verify the roster solved count/activity changes."
    notes: "The store mirrors active student telemetry into the persisted roster."

  - name: cross-tab-cohort-sync
    medium: framework-context
    key: "SYNC_STORE"
    writer:
      unit: problems
      source_loc: "src/store/userStore.ts:103-115"
    reader:
      unit: administration
      source_loc: "src/store/userStore.ts:1010-1020"
    pairing: dynamic-key
    must_preserve: true
    must_confirm: runtime
    verification_hint: "Open two tabs, mutate student progress in one, and verify the other rehydrates the roster."
    notes: "BroadcastChannel availability is feature-detected; storage events provide the fallback."

  - name: completed-lessons-to-academic-views
    medium: database
    key: "completedLessons"
    writer:
      unit: lpu-portal
      source_loc: "src/pages/LpuPortalPage.tsx:250"
    reader:
      unit: dashboard
      source_loc: "src/pages/DashboardPage.tsx:20-39"
    pairing: matched
    must_preserve: true
    must_confirm: null
    verification_hint: "Complete an LPU topic and verify completion appears in the dashboard."
    notes: "The state is persisted in the same Zustand payload."
